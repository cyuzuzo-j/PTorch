experiment_name: gapped_step_check
random_seed: 43
num_runs: 1

max_steps: 800
eval_every: 100
patience: 200
batch_sizes: [256]

norms:
  - l2

results_dir: results_gapped_check

tasks:
  - name: MNIST
    dataset: MNIST
    in_features: 784
    classes: 10
    hidden: [128]

activations:
  - GappedStep

ptorch_optimizer: ProjectionAdam
ptorch_optimizer_kwargs:
  lr: 0.001

losses:
  - CrossEntropy
