##################################################
###   WandB Sweep — PTorch CNN on CIFAR-10     ###
##################################################

program: experiments/cnn_benchmarks/sweep_ptorch.py
method: bayes
name: ptorch_cnn_cifar10_sweep

metric:
  name: best_val_acc
  goal: maximize

parameters:
  # ── Optimizer ─────────────────────────────────
  optimizer:
    values:
      - AlternatingProjections
      - ProjectionSGD
      - AlternatingProjectionsMomentum
      - ProjectionAdam
      - ProjectionAdagrad
      - ProjectionAdadelta

  # ── Learning rate (log scale) ─────────────────
  # Only relevant for optimizers that accept lr
  lr:
    distribution: log_uniform_values
    min: 0.001
    max: 10000.0

  # ── Projection stiffness parameters ───────────
  alpha:
    distribution: log_uniform_values
    min: 0.01
    max: 100.0

  g:
    distribution: log_uniform_values
    min: 0.01
    max: 100.0

  # ── Batch size ────────────────────────────────
  batch_size:
    values: [8, 16, 32, 64]

  # ── Architecture (conv widths) ────────────────
  architecture:
    values:
      - "[4, 8, 8]"
      - "[8, 16, 16]"
      - "[4, 8]"
      - "[8, 16]"
      - "[4, 8, 16]"
      - "[8, 16, 32]"

  # ── Training ──────────────────────────────────
  max_steps:
    value: 5000

  eval_every:
    value: 100

  patience:
    value: 15

  seed:
    value: 43

early_terminate:
  type: hyperband
  min_iter: 500
  eta: 3
