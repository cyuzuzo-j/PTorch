##################################################
###   Shared experiment configuration          ###
###   Used by all benchmark scripts            ###
##################################################

# ── Experiment identity ───────────────────────────
experiment_name: cnn_benchmark   # shown in wandb as the run prefix
random_seed: 43
max_steps: 5000
num_runs: 3
eval_every: 1
patience: 1000

# ── Model architecture ───────────────────────────
# Each entry is the width of one ConvGroup block.
# The number of entries determines how many ConvGroup layers are stacked.
conv_widths: [4]

# ── Batch sizes to sweep ─────────────────────────
batch_sizes: [64]

# ── Tasks ─────────────────────────────────────────
tasks:
  - name: CIFAR10
    classes: 10
    in_channels: 3
  - name: MNIST
    classes: 10
    in_channels: 1


# ── Optimizers per framework ──────────────────────
# pjax_orr (original) — optim classes
pjax_orr_optimizer: DouglasRachford
pjax_orr_optimizer_kwargs:
  steps_per_update: 50

# ptorch — ptorch.optim_static classes
ptorch_optimizer: ProjectionMuon
ptorch_optimizer_kwargs:
  lr: 0.001
# torch — any torch.optim class
torch_optimizer: Adam
torch_optimizer_kwargs:
  lr: 0.001
