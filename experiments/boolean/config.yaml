##################################################
###   Boolean XOR experiment configuration     ###
##################################################

# ── Experiment identity ───────────────────────────
experiment_name: xor_benchmark
random_seed: 42
num_runs: 1

# ── Training ──────────────────────────────────────
max_steps: 20_000
eval_every: 10
patience: 100

# ── Data ──────────────────────────────────────────
xor_bits: 2
batch_sizes: [4]

# ── Network architecture ─────────────────────────
tasks:
  - name: XOR
    in_features: 2
    classes: 1
    hidden: [32]

# ── Activation functions to sweep ────────────────
# Each entry maps to a class in ptorch.nn.modules.
# The benchmark will run every (task × batch_size × activation × run) combo.
#
# Available activations:
#   - LeakyReLU   (params: negative_slope)
#   - ReLU        (params: none)
#   - Step        (params: none)
#   - GappedStep  (params: delta)
#
activations:
  - name: Step
  # Uncomment to sweep over more activations:
  # - name: ReLU
  #   params: {}
  # - name: Step
  #   params: {}

# ── Optimizer ─────────────────────────────────────
# Available: ProjectionSGD,
#            ProjectionAdam, ProjectionAdagrad,
#            ProjectionAdadelta, ProjectionMuon
ptorch_optimizer: ProjectionSGD
ptorch_optimizer_kwargs:
  lr: 1.0

# ── Layer defaults ────────────────────────────────
# These are forwarded to every Linear / LinearFrozen layer.
layer_defaults:
  bias: false
  g: 1.0
  alpha: 1.0
  num_iters: 10
