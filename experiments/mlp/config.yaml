##################################################
###   Shared experiment configuration          ###
###   Used by all 4 benchmark scripts         ###
##################################################

# ── Experiment identity ───────────────────────────
experiment_name: mlp_benchmark_norms
random_seed: 43
max_steps: 500000
num_runs: 1
eval_every: 50
patience: 10000
ptorch_norm: 2  # l2 | linf"]
# ── Batch sizes to sweep ─────────────────────────
batch_sizes: [8, 128, 512]

# ── Tasks (comment out to disable) ───────────────
tasks:
  - name: MNIST
    in_features: 784
    classes: 10
    hidden: [128]

  - name: CIFAR10
    in_features: 3072
    classes: 10
    hidden: [512]


# ── Optimizers per framework ──────────────────────
# pjax (new) — optim_static or optim classes
pjax_optimizer: CyclicProjections  # AlternatingProjections
pjax_optimizer_kwargs:
  steps_per_update: 50

# pjax_orr (original) — optim classes
pjax_orr_optimizer: DouglasRachford  # AlternatingProjections | AlternatingReflections | DouglasRachford | DifferenceMap | CyclicProjections | CyclicDouglasRachford
pjax_orr_optimizer_kwargs:
  steps_per_update: 50

# ptorch — ptorch.optim_static classes
ptorch_optimizer: ProjectionMuon  # AlternatingProjections | AlternatingProjectionsMomentum | ProjectionSGD | ProjectionAdam | ProjectionAdagrad | ProjectionAdadelta
ptorch_optimizer_kwargs: {lr: 0.001}
ptorch_loss_projection: CrossEntropyProjection  # CrossEntropyProjection | HardMarginProjection | ProximalHingeMargin | SmoothSoftMargin

# torch — any torch.optim class
torch_optimizer: SGD             # Adam | SGD | AdamW | ...
torch_optimizer_kwargs:
  lr: 0.01
