##################################################
###   Projection Norm Comparison (§4.x)        ###
###   Sweeps ℓ₂ vs ℓ∞ projection norms on      ###
###   MNIST with hidden widths 128 and 512      ###
##################################################

# ── Experiment identity ───────────────────────────
experiment_name: norm_comparison
random_seed: 43
num_runs: 6

# ── Training ──────────────────────────────────────
max_steps: 50_000
eval_every: 200
patience: 10
batch_sizes: [1024]


# ── Output ────────────────────────────────────────
results_dir: results/norm_comparison
figures_dir: ../../images/mlp

# ── Tasks ─────────────────────────────────────────
# Two hidden-width variants, both on MNIST
tasks:
  - name: MNIST_128
    dataset: MNIST
    in_features: 784
    classes: 10
    hidden: [64]

# ── Projection norms to sweep ────────────────────
# Each entry is passed as the `norm` kwarg to Linear layers.
#   l2   — efficient L2 (Frobenius) projection
#   linf — L∞ (Chebyshev) projection (slower per step, higher final accuracy)
norms:
  - l2
  - linf

# ── Optimizer ─────────────────────────────────────
ptorch_optimizer: ProjectionMuon
ptorch_optimizer_kwargs:
  lr: 0.001
ptorch_loss: HardMarginLoss
