##################################################
###   Optimizer Influence Comparison           ###
###   Compares SGD, Adam, Adadelta, and Muon   ###
##################################################

experiment_name: optimizer_comparison
random_seed: 42
num_runs: 3

# ── Training ──────────────────────────────────────
max_steps: 10_000
eval_every: 100
patience: 100
batch_sizes: [32]


# ── Output ────────────────────────────────────────
results_dir: results/optimizer_comparison
figures_dir: ../../images/mlp

# ── Tasks ─────────────────────────────────────────
tasks:
  - name: MNIST_64
    dataset: MNIST
    in_features: 784
    classes: 10
    hidden: [64]

# ── Projection norm ───────────────────────────────
norms:
  - l2

# ── Loss ──────────────────────────────────────────
losses:
  - CrossEntropy

# ── Optimizers to sweep ───────────────────────────
optimizers:
  - name: ProjectionSGD
    kwargs:
      lr: 10.0
  - name: ProjectionAdam
    kwargs:
      lr: 0.001
      betas: [0.9, 0.999]
  - name: ProjectionMuon
    kwargs:
      lr: 0.001
