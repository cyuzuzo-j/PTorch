experiment_name: deep_mlp
random_seed: 43
num_runs: 1

max_steps: 10000
eval_every: 200
patience: 10
batch_sizes: [32]
K: 50

results_dir: results/deep_mlp
figures_dir: ../../images/mlp

tasks:
  - name: MNIST_4L
    dataset: MNIST
    in_features: 784
    classes: 10
    hidden: [512, 512, 512, 512]

use_muon_activations: [true, false]

ptorch_optimizer: ProjectionMuon
ptorch_optimizer_kwargs:
  lr: 0.001
ptorch_loss: HardMarginLoss

torch_optimizer: Adam
torch_optimizer_kwargs:
  lr: 0.001
