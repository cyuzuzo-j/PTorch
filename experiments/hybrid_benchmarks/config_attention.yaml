experiment_name: "hybrid_attention"

attention_type: "simplex"

tasks:
  - name: "SST2"
    classes: 2
    vocab_size: 10_000
    embed_dim: 128
    max_seq_len: 64

batch_sizes: [512]
num_runs: 1
random_seed: 44
eval_every: 50
max_steps: 1000
patience: 20
alternating_freq: 100

ptorch_optimizer: "ProjectionMuon"
ptorch_optimizer_kwargs:
  lr: 0.001
ptorch_norm: inf
