# ──────────────────────────────────────────────────
#   Experiment configuration for NLP Benchmarks
# ──────────────────────────────────────────────────
experiment_name: "nlp_bench"

# tasks
tasks:
  - name: "SST2"
    classes: 2
    vocab_size: 10_000
    embed_dim: 128
    hidden_dim: [256, 128] # for MLP model
    max_seq_len: 64

batch_sizes: [512]
num_runs: 1
random_seed: 42
eval_every: 100
max_steps: 50_000
patience: 50

# optimizers
torch_optimizer: "SGD"
torch_optimizer_kwargs:
  lr: 0.001

pjax_optimizer: "DouglasRachford"
pjax_optimizer_kwargs:

pjax_orr_optimizer: "AlternatingProjections"
pjax_orr_optimizer_kwargs:

ptorch_optimizer: "ProjectionAdadelta"
ptorch_optimizer_kwargs:
  lr: 10
