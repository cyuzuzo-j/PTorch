# ──────────────────────────────────────────────────
#   Experiment configuration for NLP Benchmarks
# ──────────────────────────────────────────────────
experiment_name: "nlp_bench"

# model
# attention_type: one of [simplex, hardmax, softmax]
attention_type: "simplex"
attention_heads: 8      # use the same number of heads across torch and ptorch

# tasks
tasks:
  - name: "SST2"
    classes: 2
    vocab_size: 5_000
    embed_dim: 128
    hidden_dim: [512] # for MLP model
    max_seq_len: 64

batch_sizes: [512]
num_runs: 1
random_seed: 42
eval_every: 100
max_steps: 50_000
patience: 500

# optimizers
torch_optimizer: "Adam"
torch_optimizer_kwargs:
  lr: 0.001

pjax_optimizer: "DouglasRachford"
pjax_optimizer_kwargs:

pjax_orr_optimizer: "AlternatingProjections"
pjax_orr_optimizer_kwargs:

ptorch_optimizer: "ProjectionMuon"
ptorch_optimizer_kwargs:
  lr: 0.001
ptorch_norm: 2 # norm order for projection-based ptorch layers (e.g. 2, inf)
