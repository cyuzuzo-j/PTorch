##################################################
###   Shared experiment configuration          ###
###   Used by the attention benchmark          ###
##################################################

# ── Experiment identity ───────────────────────────
experiment_name: attention_benchmark   # shown in wandb as the run group
random_seed: 43
max_steps: 5000
num_runs: 1
eval_every: 50
patience: 1000

# ── Batch sizes to sweep ─────────────────────────
batch_sizes: [512]

# ── Tasks (comment out to disable) ───────────────
tasks:
  - name: MNIST
    patch_size: 7
    emb_dim: 64
    num_heads: 4
    classes: 10

# ── Optimizers per framework ──────────────────────
torch_optimizer: AdamW
torch_optimizer_kwargs:
  lr: 0.001
  weight_decay: 0.01


ptorch_optimizer: ProjectionAdadelta  # AlternatingProjections | AlternatingProjectionsMomentum | ProjectionSGD | ProjectionAdam | ProjectionAdagrad | ProjectionAdadelta
ptorch_optimizer_kwargs: {lr: 1}
