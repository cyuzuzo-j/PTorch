# Optimizers applied to the projection residuals (paper fig:opt):
# Experiment 1 (config.yaml, l2, MNIST) with only the optimizer changed.
# SGD at lr 1, Adam at its standard 1e-3, Muon as in Experiment 1.
#   python -m experiments.neurips.mlp.bench_ptorch --config experiments/neurips/mlp/optimizer_comparison_config.yaml --fresh
#   python -m experiments.neurips.plot_curves --config experiments/neurips/mlp/optimizer_comparison_config.yaml

random_seed: 2026             # run r uses seed 2026 + r
num_runs: 3
batch_sizes: [32]
max_steps: 5000
eval_every: 200               # steps between validation evaluations
patience: 100                 # evaluations without improvement before stopping (100 > 5000/200: off)

results_dir: results/optimizer_comparison
figures_dir: ../../../images

tasks:
  - name: MNIST_1L
    dataset: MNIST
    in_features: 784
    classes: 10
    hidden: [1024]

ptorch:
  defaults:
    loss: CrossEntropy        # proximal CE, lambda = 10, 1 step (the defaults)
  variants:
    - {name: sgd, optimizer: {name: ProjectionSGD, kwargs: {lr: 1.0}}}
    - {name: adam, optimizer: {name: ProjectionAdam, kwargs: {lr: 0.001}}}
    - {name: muon, optimizer: {name: ProjectionMuon, kwargs: {lr: 0.001, weight_decay: 0.1}}}

labels:
  sgd: SGD
  adam: Adam
  muon: Muon

plots:
  - {file: optimizer_comparison.pdf, x: step, title: Optimizer Comparison, legend_title: Optimizer,
     ylim: [0.75, 1.0]}
