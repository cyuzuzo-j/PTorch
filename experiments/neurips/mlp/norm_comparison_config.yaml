# l2 vs l_inf projections over wall-clock time (paper fig:norm-comparison):
# Experiment 1 (config.yaml, MNIST) at batch sizes 32 and 1024.
#   python -m experiments.neurips.mlp.bench_ptorch --config experiments/neurips/mlp/norm_comparison_config.yaml --fresh
#   python -m experiments.neurips.plot_curves --config experiments/neurips/mlp/norm_comparison_config.yaml

random_seed: 2026             # run r uses seed 2026 + r
num_runs: 3
batch_sizes: [32, 1024]
max_steps: 5000
eval_every: 200               # steps between validation evaluations
patience: 100                 # evaluations without improvement before stopping (100 > 5000/200: off)

results_dir: results/norm_comparison
figures_dir: ../../../images/mlp

tasks:
  - name: MNIST_1L
    dataset: MNIST
    in_features: 784
    classes: 10
    hidden: [1024]

ptorch:
  defaults:
    optimizer: {name: ProjectionMuon, kwargs: {lr: 0.001, weight_decay: 0.1}}
    loss: CrossEntropy        # proximal CE, lambda = 10, 1 step (the defaults)
  variants:
    - {name: l2, norm: l2}
    - {name: linf, norm: linf}

labels:
  l2: $\ell_2$ Projection
  linf: $\ell_\infty$ Projection

plots:
  - {file: norm_comparison_time_32.pdf, where: {batch_size: 32}, x: time, xscale: log, time_bins: 500,
     title: Effect of Projection Norm}
  - {file: norm_comparison_time_1024.pdf, where: {batch_size: 1024}, x: time, xscale: log, time_bins: 500,
     title: Effect of Projection Norm}
