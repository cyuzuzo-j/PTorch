[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptorch"
version = "0.1.0"
description = "PyTorch-based framework for training neural networks via cyclic projections instead of backpropagation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jeff Cyuzuzo Jambe", email = "cyuzuzo.jambe@gmail.com" },
]
keywords = ["pytorch", "projections", "deep-learning", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
experiments = [
    "torchvision",
    "pandas",
    "tqdm",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "requests",
    "wandb",
]
jax = [
    "jax",
    "jaxlib",
]
dev = [
    "pytest>=7",
    "ruff>=0.5",
    "build",
]

[project.urls]
Homepage = "https://github.com/cyuzuzo-j/learning_with_projections"
Issues = "https://github.com/cyuzuzo-j/learning_with_projections/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ptorch"]
exclude = [
    "src/ptorch/core/tests",
    "src/ptorch/nn/tests",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/ptorch",
    "tests",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "wandb", "logs", "dataset", "images", ".python_prefix", ".python_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
