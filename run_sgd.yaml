experiment_name: mlp_benchmark_norms
random_seed: 43
max_steps: 200
num_runs: 1
eval_every: 100
patience: 10
log_loss_projection: true
ptorch_norm_sweep: ["inf"]
ptorch_use_hybrid: false
ptorch_use_boolean: true
batch_sizes: [32]
tasks:
  - name: MNIST
    in_features: 784
    classes: 10
    hidden: [256, 128]
ptorch_optimizer: ProjectionSGD
ptorch_optimizer_kwargs: {lr: 100.0}
ptorch_loss_projection: ProximalHingeMargin
